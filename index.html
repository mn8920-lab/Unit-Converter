<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Unit Converter</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #238636;
            --accent-hover: #2ea043;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .converter-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        h2 {
            margin-top: 0;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 8px 12px;
            box-sizing: border-box;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 14px;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .row {
            display: flex;
            gap: 12px;
        }
        .row .form-group {
            flex: 1;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        .result {
            margin-top: 20px;
            padding: 12px;
            background-color: rgba(56, 139, 253, 0.1);
            border: 1px solid rgba(56, 139, 253, 0.4);
            border-radius: 6px;
            text-align: center;
            font-size: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="converter-card">
    <h2>Unit Converter</h2>
    
    <div class="form-group">
        <label for="category">Category</label>
        <select id="category" onchange="updateUnits()">
            <option value="length">Length</option>
            <option value="weight">Weight/Mass</option>
            <option value="temperature">Temperature</option>
        </select>
    </div>

    <div class="form-group">
        <label for="inputValue">Value</label>
        <input type="number" id="inputValue" value="1" oninput="convert()">
    </div>

    <div class="row">
        <div class="form-group">
            <label for="fromUnit">From</label>
            <select id="fromUnit" onchange="convert()"></select>
        </div>
        <div class="form-group">
            <label for="toUnit">To</label>
            <select id="toUnit" onchange="convert()"></select>
        </div>
    </div>

    <div class="result" id="resultValue">1 m = 1 m</div>
</div>

<script>
    const units = {
        length: {
            m: { name: "Meters", factor: 1 },
            km: { name: "Kilometers", factor: 1000 },
            ft: { name: "Feet", factor: 0.3048 },
            inch: { name: "Inches", factor: 0.0254 }
        },
        weight: {
            kg: { name: "Kilograms", factor: 1 },
            g: { name: "Grams", factor: 0.001 },
            lb: { name: "Pounds", factor: 0.453592 },
            oz: { name: "Ounces", factor: 0.0283495 }
        },
        temperature: {
            C: { name: "Celsius" },
            F: { name: "Fahrenheit" },
            K: { name: "Kelvin" }
        }
    };

    function updateUnits() {
        const category = document.getElementById("category").value;
        const fromSelect = document.getElementById("fromUnit");
        const toSelect = document.getElementById("toUnit");
        
        fromSelect.innerHTML = "";
        toSelect.innerHTML = "";

        for (let key in units[category]) {
            let opt1 = document.createElement("option");
            opt1.value = key;
            opt1.textContent = units[category][key].name;
            fromSelect.appendChild(opt1);

            let opt2 = document.createElement("option");
            opt2.value = key;
            opt2.textContent = units[category][key].name;
            toSelect.appendChild(opt2);
        }
        
        if(toSelect.options.length > 1) {
            toSelect.selectedIndex = 1;
        }
        
        convert();
    }

    function convert() {
        const category = document.getElementById("category").value;
        const val = parseFloat(document.getElementById("inputValue").value);
        const from = document.getElementById("fromUnit").value;
        const to = document.getElementById("toUnit").value;
        const resultDiv = document.getElementById("resultValue");

        if (isNaN(val)) {
            resultDiv.textContent = "Please enter a valid number";
            return;
        }

        let result;

        if (category === "temperature") {
            let tempInC;
            if (from === "C") tempInC = val;
            else if (from === "F") tempInC = (val - 32) * 5 / 9;
            else if (from === "K") tempInC = val - 273.15;

            if (to === "C") result = tempInC;
            else if (to === "F") result = (tempInC * 9 / 5) + 32;
            else if (to === "K") result = tempInC + 273.15;
        } else {
            const fromFactor = units[category][from].factor;
            const toFactor = units[category][to].factor;
            result = val * (fromFactor / toFactor);
        }

        resultDiv.textContent = `${val} ${from} = ${result.toFixed(4).replace(/\.?0+$/, "")} ${to}`;
    }

    // Initialize
    updateUnits();
</script>
</body>
</html>
